name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 刻意不装任何第三方依赖 —— 这正是本项目的承诺，CI 顺带验证它。
      #
      # 输出同时落一份到文件，失败时下一步把它变成 annotation。
      # 用 tee 并显式 pipefail：不写 pipefail 的话退出码会被 tee 吃掉，
      # 测试挂了 CI 却报绿 —— 那比不测还糟。
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . 2>&1 | tee unit-test.log

      # 把失败的测试名贴成 annotation。
      # 这一条是为了排查方便：job 的日志正文需要认证才读得到，而 annotation
      # 在**公开仓库**里不带 token 也能从 API 读到 —— 出现「CI 红而本地绿」
      # 时，不必再等谁去网页上把日志抄下来。
      #
      # 先报几行环境事实：排查「同一个测试本地过、CI 挂」时，默认编码、
      # stdout 编码这些往往就是答案（英文 Windows 的 cp1252 编不出汉字，
      # 中文系统是 cp936，Linux 是 utf-8）。
      # GitHub 对 annotation 有数量上限（每个 step 10 条），所以只挑最要紧的。
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          {
            python -c "import sys, locale; print('python', sys.version.split()[0]); print('preferred encoding', locale.getpreferredencoding(False)); print('stdout encoding', sys.stdout.encoding)"
            echo "---"
            grep -E '^(FAIL|ERROR): ' unit-test.log | head -8
            echo "---"
            grep -E '^(Ran |FAILED|OK)' unit-test.log | tail -2
          } | tr -d '\r' | head -10 | while IFS= read -r line; do
            echo "::error::${line//'%'/'%25'}"
          done
